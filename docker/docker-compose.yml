version: "3.8"

services:
  eval-harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: eval-harness
    ports:
      - "8005:8005"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  eval_data: